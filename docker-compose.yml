      retries: 5
      start_period: 60s
    networks:
      - vibecheck-network

  # Booking Service
  booking-service:
    build:
      context: ./booking-system/booking-service
      dockerfile: Dockerfile
    container_name: vibecheck-booking
    restart: unless-stopped
