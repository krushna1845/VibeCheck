apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: notification-service
spec:
  replicas: {{ .Values.services.notification.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        {{- include "vibecheck.labels" . | nindent 8 }}
        app.kubernetes.io/name: notification-service
    spec:
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - notification-service
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: notification-service
          image: "{{ .Values.services.notification.image.repository }}:{{ .Values.services.notification.image.tag }}"
          imagePullPolicy: {{ .Values.services.notification.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.notification.port }}
          envFrom:
            - configMapRef:
                name: vibecheck-common-config
            - secretRef:
                name: vibecheck-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/vibecheck_notification?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibecheck-secrets
                  key: DB_ROOT_PASSWORD
          resources:
            {{- toYaml .Values.services.notification.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: notification-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.notification.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: notification-service
