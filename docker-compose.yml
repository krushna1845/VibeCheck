      - vibecheck-network

volumes:
  mysql_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local

networks:
  vibecheck-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

