{{- range $serviceKey, $serviceVal := .Values.services }}
{{- if and $serviceVal.autoscaling $serviceVal.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $serviceVal.name }}-hpa
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $serviceVal.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $serviceVal.name }}
  minReplicas: {{ $serviceVal.autoscaling.minReplicas }}
  maxReplicas: {{ $serviceVal.autoscaling.maxReplicas }}
  metrics:
    {{- if $serviceVal.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $serviceVal.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $serviceVal.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $serviceVal.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
