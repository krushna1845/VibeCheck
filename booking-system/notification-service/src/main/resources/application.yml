server:
  port: 8086

spring:
  application:
    name: notification-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vibecheck_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.krushna.moviebooking.*"
        spring.json.type.mapping: "com.krushna.moviebooking.booking.event.BookingConfirmedEvent:com.krushna.moviebooking.common.event.BookingEvents$BookingConfirmedEvent,com.krushna.moviebooking.booking.event.BookingCancelledEvent:com.krushna.moviebooking.common.event.BookingEvents$BookingCancelledEvent,com.krushna.moviebooking.booking.event.BookingExpiredEvent:com.krushna.moviebooking.common.event.BookingEvents$BookingExpiredEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  data:
    redis:
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
    test-connection: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      redis:
        enabled: false
      redisreactive:
        enabled: false
  health:
    redis:
      enabled: false
    redisreactive:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

# Application-specific properties
notification:
  mail:
    from: ${MAIL_FROM:noreply@vibecheck.com}
    from-name: "VibeCheck Booking"
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  retry:
    max-attempts: 3
    backoff-delay-ms: 5000
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:MOCK}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}/%X{spanId}] %logger{36} - %msg%n"
  level:
    com.krushna.moviebooking.notification: DEBUG
    org.springframework.kafka: INFO
