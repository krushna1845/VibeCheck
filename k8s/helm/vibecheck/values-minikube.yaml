# Minikube-specific values override
global:
  namespace: vibecheck
  environment: local
  imagePullPolicy: IfNotPresent

secrets:
  dbRootPassword: "Krish@123"
  jwtSecret: "9a4f2c8d7e6b5a4c3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a"
  internalSecuritySecret: "vibecheck-internal-perimeter-secret-key-m17"

infrastructure:
  mysql:
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    persistence:
      storageClass: "standard"
      size: 2Gi

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    persistence:
      storageClass: "standard"
      size: 1Gi

  zookeeper:
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 384Mi
    persistence:
      storageClass: "standard"
      size: 1Gi

  kafka:
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 600m
        memory: 768Mi
    persistence:
      storageClass: "standard"
      size: 2Gi

