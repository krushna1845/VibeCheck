server:
  port: 8080
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_service
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    host: localhost
    port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,info
