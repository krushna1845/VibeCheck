spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}

internal:
  security:
    secret: ${INTERNAL_SECURITY_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://vibecheck.com,https://admin.vibecheck.com}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
