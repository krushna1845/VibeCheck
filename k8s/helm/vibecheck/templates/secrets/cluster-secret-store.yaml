---
# ClusterSecretStore for VibeCheck
# Defines the connection to the external secret provider.
# This is rendered when externalSecrets.enabled=true AND externalSecrets.deployStore=true.
#
# The ClusterSecretStore holds credentials to access the secret backend.
# Provider credentials are injected via Kubernetes Secrets (not committed to Git).
#
# Supported providers (configure via values.externalSecrets.provider):
#   - vault    : HashiCorp Vault (KV v2 secrets engine)
#   - aws      : AWS Secrets Manager
#   - gcpsm    : Google Cloud Secret Manager
#   - azurekv  : Azure Key Vault
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.deployStore }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-management
spec:
  provider:
    {{- if eq .Values.externalSecrets.provider "vault" }}
    # HashiCorp Vault KV v2 provider
    vault:
      server: {{ .Values.externalSecrets.vault.address | quote }}
      path: {{ .Values.externalSecrets.vault.kvPath | default "secret" | quote }}
      version: v2
      auth:
        # Kubernetes Service Account auth (recommended for K8s workloads)
        kubernetes:
          mountPath: {{ .Values.externalSecrets.vault.authMountPath | default "kubernetes" | quote }}
          role: {{ .Values.externalSecrets.vault.role | default "vibecheck" | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.vault.serviceAccount | default "vibecheck-eso-sa" | quote }}
    {{- else if eq .Values.externalSecrets.provider "aws" }}
    # AWS Secrets Manager provider
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.aws.region | default "ap-south-1" | quote }}
      auth:
        # IRSA (IAM Roles for Service Accounts) - no credentials in manifests
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.aws.serviceAccount | default "vibecheck-eso-sa" | quote }}
    {{- else if eq .Values.externalSecrets.provider "gcpsm" }}
    # Google Cloud Secret Manager provider
    gcpsm:
      projectID: {{ .Values.externalSecrets.gcp.projectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.externalSecrets.gcp.clusterLocation | default "asia-south1" | quote }}
          clusterName: {{ .Values.externalSecrets.gcp.clusterName | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.gcp.serviceAccount | default "vibecheck-eso-sa" | quote }}
    {{- else }}
    # Default: no provider configured. Set externalSecrets.provider to vault/aws/gcpsm/azurekv
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets-system
          key: token
    {{- end }}
{{- end }}
