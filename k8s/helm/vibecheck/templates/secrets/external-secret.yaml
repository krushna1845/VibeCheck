---
# ExternalSecret for VibeCheck production secrets
# Requires External Secrets Operator (ESO) v0.9+:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#
# ClusterSecretStore must be deployed first with provider credentials.
# See: k8s/helm/vibecheck/templates/secrets/cluster-secret-store.yaml
#
# This resource is conditionally rendered only when externalSecrets.enabled=true
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vibecheck-external-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
  annotations:
    # Force refresh every 1h to pick up rotated credentials
    external-secrets.io/refresh-interval: "3600s"
spec:
  # How often ESO syncs secrets from the provider
  refreshInterval: 1h
  # Reference to the ClusterSecretStore defining the provider
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  # The Kubernetes Secret to create/update
  target:
    name: vibecheck-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      # Optional: annotate the synced secret for audit
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: vibecheck
  # Mapping from external provider paths to Kubernetes Secret keys
  data:
    - secretKey: DB_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/database
        property: root_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/auth
        property: jwt_secret
    - secretKey: INTERNAL_SECURITY_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/auth
        property: internal_security_secret
    - secretKey: PAYMENT_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/payment
        property: webhook_secret
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/payment/razorpay
        property: key_id
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/payment/razorpay
        property: key_secret
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/payment/razorpay
        property: webhook_secret
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/payment/stripe
        property: api_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/payment/stripe
        property: webhook_secret
    - secretKey: MAIL_HOST
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/notification/mail
        property: host
    - secretKey: MAIL_PORT
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/notification/mail
        property: port
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/notification/mail
        property: username
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/notification/mail
        property: password
    - secretKey: MAIL_FROM
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/notification/mail
        property: from_address
{{- end }}
