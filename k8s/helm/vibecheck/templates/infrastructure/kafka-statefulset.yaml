apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
spec:
  serviceName: kafka-headless
  replicas: {{ .Values.infrastructure.kafka.replicaCount | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "vibecheck.labels" . | nindent 8 }}
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: messaging
    spec:
      # Spread brokers across nodes for fault isolation
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - kafka
                topologyKey: kubernetes.io/hostname
      {{- end }}
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for ZooKeeper at zookeeper:2181..."
              until nc -z zookeeper 2181; do
                echo "ZooKeeper not ready, retrying in 3s..."
                sleep 3
              done
              echo "ZooKeeper is up!"
      containers:
        - name: kafka
          image: "{{ .Values.infrastructure.kafka.image.repository }}:{{ .Values.infrastructure.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.infrastructure.kafka.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              # Derive BROKER_ID from pod ordinal (kafka-0 -> 1, kafka-1 -> 2, kafka-2 -> 3)
              export KAFKA_BROKER_ID=$((${HOSTNAME##*-} + 1))
              # Derive per-broker advertised listener using stable headless DNS
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:9092,PLAINTEXT_CLIENT://kafka:29092"
              # Remove stale meta.properties to avoid broker ID mismatch on restart
              rm -f /var/lib/kafka/data/meta.properties
              unset KAFKA_PORT
              exec /etc/confluent/docker/run
          ports:
            - name: kafka-internal
              containerPort: 9092
          env:
            # ZooKeeper connection
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            # Listener configuration
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_CLIENT://0.0.0.0:29092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_CLIENT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # HA replication settings -- require 3 brokers for full durability
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "{{ .Values.infrastructure.kafka.replicationFactor | default 3 }}"
            - name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "{{ .Values.infrastructure.kafka.replicationFactor | default 3 }}"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "{{ .Values.infrastructure.kafka.minInSyncReplicas | default 2 }}"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "{{ .Values.infrastructure.kafka.replicationFactor | default 3 }}"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "{{ .Values.infrastructure.kafka.minInSyncReplicas | default 2 }}"
            # Producer durability: require acknowledgment from all ISR replicas
            - name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
              value: "false"
            # Topic auto-creation (kept for outbox relay compatibility)
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # Log retention (7 days default)
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "-1"
            # Heap: small footprint for Kubernetes
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms256m"
          resources:
            {{- toYaml .Values.infrastructure.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          startupProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      {{- if not .Values.infrastructure.kafka.persistence.enabled }}
      volumes:
        - name: kafka-data
          emptyDir: {}
      {{- end }}
  {{- if .Values.infrastructure.kafka.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: [ {{ .Values.infrastructure.kafka.persistence.accessMode | quote }} ]
        {{- if .Values.infrastructure.kafka.persistence.storageClass }}
        storageClassName: {{ .Values.infrastructure.kafka.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.infrastructure.kafka.persistence.size }}
  {{- end }}
