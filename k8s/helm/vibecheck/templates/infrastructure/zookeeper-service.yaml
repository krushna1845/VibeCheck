apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: zookeeper
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.infrastructure.zookeeper.port }}
      targetPort: client
  selector:
    app.kubernetes.io/name: zookeeper
