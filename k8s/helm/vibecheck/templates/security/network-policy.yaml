{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vibecheck-internal-traffic
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: vibecheck
  policyTypes:
    - Ingress
  ingress:
    # Allow all intra-namespace microservice communication
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vibecheck
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vibecheck-gateway-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming traffic to the API Gateway from any ingress controller or external source
    - ports:
        - protocol: TCP
          port: {{ .Values.services.gateway.port }}
{{- end }}
