apiVersion: v1
kind: Secret
metadata:
  name: vibecheck-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_ROOT_PASSWORD: {{ .Values.secrets.dbRootPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  INTERNAL_SECURITY_SECRET: {{ .Values.secrets.internalSecuritySecret | quote }}
  PAYMENT_WEBHOOK_SECRET: {{ .Values.secrets.payment.webhookSecret | quote }}
  RAZORPAY_KEY_ID: {{ .Values.secrets.payment.razorpayKeyId | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.payment.razorpayKeySecret | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.secrets.payment.razorpayWebhookSecret | quote }}
  STRIPE_API_KEY: {{ .Values.secrets.payment.stripeApiKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.payment.stripeWebhookSecret | quote }}
  MAIL_HOST: {{ .Values.secrets.mail.host | quote }}
  MAIL_PORT: {{ .Values.secrets.mail.port | quote }}
  MAIL_USERNAME: {{ .Values.secrets.mail.username | quote }}
  MAIL_PASSWORD: {{ .Values.secrets.mail.password | quote }}
  MAIL_FROM: {{ .Values.secrets.mail.from | quote }}
