apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: coordination
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        {{- include "vibecheck.labels" . | nindent 8 }}
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/component: coordination
    spec:
      containers:
        - name: zookeeper
          image: "{{ .Values.infrastructure.zookeeper.image.repository }}:{{ .Values.infrastructure.zookeeper.image.tag }}"
          imagePullPolicy: {{ .Values.infrastructure.zookeeper.image.pullPolicy }}
          ports:
            - name: client
              containerPort: {{ .Values.infrastructure.zookeeper.port }}
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_SYNC_LIMIT
              value: "2"
          resources:
            {{- toYaml .Values.infrastructure.zookeeper.resources | nindent 12 }}
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          startupProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: [ {{ .Values.infrastructure.zookeeper.persistence.accessMode | default "ReadWriteOnce" | quote }} ]
        {{- if .Values.infrastructure.zookeeper.persistence.storageClass }}
        storageClassName: {{ .Values.infrastructure.zookeeper.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.infrastructure.zookeeper.persistence.size | default "2Gi" }}
    - metadata:
        name: zookeeper-log
      spec:
        accessModes: [ {{ .Values.infrastructure.zookeeper.persistence.accessMode | default "ReadWriteOnce" | quote }} ]
        {{- if .Values.infrastructure.zookeeper.persistence.storageClass }}
        storageClassName: {{ .Values.infrastructure.zookeeper.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.infrastructure.zookeeper.persistence.size | default "2Gi" }}
