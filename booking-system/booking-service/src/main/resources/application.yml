server:
  port: 8084
  # Graceful shutdown: allows in-flight HTTP requests, Kafka consumers, and outbox
  # relay operations to complete before the JVM exits. This is critical for booking
  # transactions and outbox relay to avoid data inconsistency.
  # Pairs with the preStop hook in Kubernetes (sleep 10) and Docker restart policies.
  shutdown: graceful

spring:
  lifecycle:
    # 30-second budget for active requests and Kafka consumers to finish.
    # After this timeout, Spring forces shutdown regardless.
    timeout-per-shutdown-phase: 30s

  application:
    name: booking-service
  profiles:
    include: observability
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vibecheck_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}

seat-lock:
  ttl-seconds: 300 # 5 minutes temporary lock

services:
  show-service:
    url: ${SHOW_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      redis:
        enabled: false
  health:
    show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.krushna.moviebooking.booking: INFO
