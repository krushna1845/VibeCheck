server:
  port: 8079

spring:
  application:
    name: gateway-service
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# JWT secret must match auth-service secret
jwt:
  secret: 9a4f2c8d7e6b5a4c3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a
  access-token-expiration-ms: 86400000

# Downstream service URLs (using Docker service names)
services:
  auth-url: http://auth-service:8080
  movie-url: http://movie-service:8081
  theatre-url: http://theatre-service:8082
  show-url: http://show-service:8083
  booking-url: http://booking-service:8084
  payment-url: http://payment-service:8085
  notification-url: http://notification-service:8086

# CORS Configuration
cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  allowed-headers: "*"
  exposed-headers: "X-Correlation-ID,X-Gateway-Timestamp,Authorization"
  max-age: 3600

# Rate limiting
rate-limit:
  max-requests-per-minute: 60

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50.0
        slowCallRateThreshold: 50.0
        slowCallDurationThreshold: 3000ms
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authService:
        baseConfig: default
      movieService:
        baseConfig: default
      theatreService:
        baseConfig: default
      showService:
        baseConfig: default
      bookingService:
        baseConfig: default
      paymentService:
        baseConfig: default
      notificationService:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      authService:
        baseConfig: default
      movieService:
        baseConfig: default
      theatreService:
        baseConfig: default
      showService:
        baseConfig: default
      bookingService:
        baseConfig: default
      paymentService:
        baseConfig: default
      notificationService:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      authService:
        baseConfig: default
      movieService:
        baseConfig: default
      theatreService:
        baseConfig: default
      showService:
        baseConfig: default
      bookingService:
        baseConfig: default
      paymentService:
        baseConfig: default
      notificationService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.krushna.moviebooking.gateway: INFO
    io.github.resilience4j: DEBUG
