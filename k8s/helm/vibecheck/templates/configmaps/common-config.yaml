apiVersion: v1
kind: ConfigMap
metadata:
  name: vibecheck-common-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.global.environment | quote }}
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
  MANAGEMENT_HEALTH_REDISREACTIVE_ENABLED: "false"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:9092,kafka-1.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:9092,kafka-2.kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:9092"
  SHOW_SERVICE_URL: "http://show-service:8083"
  PAYMENT_GATEWAY_PROVIDER: {{ .Values.secrets.payment.provider | quote }}
  SMS_ENABLED: {{ .Values.secrets.mail.smsEnabled | quote }}
  SMS_PROVIDER: {{ .Values.secrets.mail.smsProvider | quote }}
  JAVA_TOOL_OPTIONS: "-Xms96m -Xmx220m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
  # Prometheus / Observability & Health Probes
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
