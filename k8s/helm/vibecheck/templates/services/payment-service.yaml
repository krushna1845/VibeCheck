apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: payment-service
spec:
  replicas: {{ .Values.services.payment.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deploymentStrategy.maxSurge | default "25%" }}
      maxUnavailable: {{ .Values.deploymentStrategy.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        {{- include "vibecheck.labels" . | nindent 8 }}
        app.kubernetes.io/name: payment-service
    spec:
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - payment-service
                topologyKey: kubernetes.io/hostname
      {{- end }}
      initContainers:
        {{- include "vibecheck.waitForMySQL" . | nindent 8 }}
        {{- include "vibecheck.waitForKafka" . | nindent 8 }}
      containers:
        - name: payment-service
          image: "{{ .Values.services.payment.image.repository }}:{{ .Values.services.payment.image.tag }}"
          imagePullPolicy: {{ .Values.services.payment.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.payment.port }}
          envFrom:
            - configMapRef:
                name: vibecheck-common-config
            - secretRef:
                name: vibecheck-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/vibecheck_payment?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibecheck-secrets
                  key: DB_ROOT_PASSWORD
          resources:
            {{- toYaml .Values.services.payment.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 40
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: payment-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.payment.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: payment-service
