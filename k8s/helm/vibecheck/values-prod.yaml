# Production High-Availability values override
global:
  namespace: vibecheck
  environment: production
  imagePullPolicy: Always

services:
  gateway:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65
      targetMemoryUtilizationPercentage: 75
    pdb:
      enabled: true
      minAvailable: 2
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: 2000m
        memory: 1536Mi

  auth:
    replicaCount: 3
    pdb:
      enabled: true
      minAvailable: 2
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
    resources:
      requests:
        cpu: 400m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 1024Mi

  movie:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

  theatre:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

  show:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8
    resources:
      requests:
        cpu: 400m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 1024Mi

  booking:
    replicaCount: 4
    pdb:
      enabled: true
      minAvailable: 2
    autoscaling:
      enabled: true
      minReplicas: 4
      maxReplicas: 12
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 70
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        cpu: 2500m
        memory: 2048Mi

  payment:
    replicaCount: 3
    pdb:
      enabled: true
      minAvailable: 2
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 8
    resources:
      requests:
        cpu: 400m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 1024Mi

  notification:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.vibecheck.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vibecheck-tls-cert
      hosts:
        - api.vibecheck.com

networkPolicy:
  enabled: true

podAntiAffinity:
  enabled: true

deploymentStrategy:
  maxSurge: 25%
  maxUnavailable: 0
