apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecheck.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.gateway.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: gateway-service
